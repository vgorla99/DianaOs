name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest

      - name: Run mypy (core/)
        run: python -m mypy --explicit-package-bases core

      - name: Import smoke check
        run: python -c "import core.agents.runtime, core.skills.resolver, core.control_plane.audit_log; print('import OK')"
